name: Private Platform Images

on:
  workflow_dispatch:
  push:
    tags:
      - "yfeistai-first-release-*"

permissions:
  contents: read
  packages: write

concurrency:
  group: private-platform-images
  cancel-in-progress: false

jobs:
  build-platform-images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout yFeiSTAI
        uses: actions/checkout@v4

      - name: Checkout OpenMAIC
        uses: actions/checkout@v4
        with:
          repository: xinlingzhifei/OpenMAIC
          ref: 0cf2a330411681190e89f48e20f305345ff99f87
          path: openmaic-upstream

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push yFeiSTAI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ghcr.io/xinlingzhifei/deeptutor:first-release
          cache-from: type=gha,scope=deeptutor-first-release
          cache-to: type=gha,mode=max,scope=deeptutor-first-release

      - name: Build and push OpenMAIC
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./integrations/openmaic/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/xinlingzhifei/openmaic:0.3.1-0cf2a330
          cache-from: type=gha,scope=openmaic-0.3.1-0cf2a330
          cache-to: type=gha,mode=max,scope=openmaic-0.3.1-0cf2a330

      - name: Build and push OpenMAIC Render
        uses: docker/build-push-action@v6
        with:
          context: ./openmaic-upstream/render-service
          file: ./openmaic-upstream/render-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/xinlingzhifei/openmaic-render:0.3.1-0cf2a330
          cache-from: type=gha,scope=openmaic-render-0.3.1-0cf2a330
          cache-to: type=gha,mode=max,scope=openmaic-render-0.3.1-0cf2a330

      - name: Record image digests
        run: python scripts/render_platform_compose.py --write-image-lock

      - name: Verify image lock
        run: |
          python - <<'PY'
          from scripts.render_platform_compose import load_image_lock

          load_image_lock()
          PY

      - name: Upload image lock
        uses: actions/upload-artifact@v4
        with:
          name: private-platform-image-lock-${{ github.sha }}
          path: |
            deploy/image-lock.json
            docker-compose.platform.yml
            docker-compose.data-plane.yml
          if-no-files-found: error
