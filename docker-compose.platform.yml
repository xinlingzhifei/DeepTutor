x-images:
  deeptutor: &deeptutor-image "ghcr.io/xinlingzhifei/deeptutor:first-release@sha256:fe0f0d43030281f650fe6a531d6f4812343f79ab24ee5a6073a8a7ac3bd96412"
  openmaic: &openmaic-image "ghcr.io/xinlingzhifei/openmaic:0.3.1-0cf2a330@sha256:e9602009064587d6e84bc2c4a77c1458da7d0d8b26c6c1e2e1a337accd24c19f"
  openmaic-render: &openmaic-render-image "ghcr.io/xinlingzhifei/openmaic-render:0.3.1-0cf2a330@sha256:45ca26231728074d383a4ad00b46b99ee33facc7a823063b40ead339e304aa59"
  nginx: &nginx-image "nginx:1.29.8-alpine3.23@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de"
  postgres: &postgres-image "postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777"
  minio: &minio-image "minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e"
  minio-client: &minio-client-image "minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3"

x-teaching-process: &teaching-process
  image: *deeptutor-image
  restart: unless-stopped
  user: "1000:1000"
  entrypoint:
    - python
    - -m
    - deeptutor.teaching.processes
  healthcheck:
    disable: true
  volumes:
    - ./data:/app/data
    - type: volume
      source: platform-secret-mask
      target: /app/data/system/secrets
      read_only: true
      volume:
        nocopy: true
    - type: bind
      source: ./data/system/secrets/tenants
      target: /run/yfeistai/tenant-secrets
      read_only: true
  networks:
    - platform-internal
  depends_on:
    teaching-migrate:
      condition: service_completed_successfully
    minio-bootstrap:
      condition: service_completed_successfully
    shared-data-plane-bootstrap:
      condition: service_completed_successfully

services:
  pocketbase:
    ports: !reset []
    profiles:
      - legacy-local

  sandbox-runner:
    profiles:
      - local-sandbox

  deeptutor:
    image: *deeptutor-image
    build: !reset null
    ports: !reset []
    environment:
      DEEPTUTOR_SANDBOX_RUNNER_URL: !reset null
    depends_on:
      pocketbase: !reset null
      sandbox-runner: !reset null
      teaching-migrate:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
      shared-data-plane-bootstrap:
        condition: service_completed_successfully
    networks: !override
      - platform-internal
      - platform-service-egress
    secrets:
      - platform_database_app_password
      - classroom_ticket_secret
      - openmaic_service_secret
    volumes:
      - type: volume
        source: platform-secret-mask
        target: /app/data/system/secrets
        read_only: true
        volume:
          nocopy: true
      - type: bind
        source: ./data/system/secrets/tenants
        target: /run/yfeistai/tenant-secrets
        read_only: true

  gateway:
    image: *nginx-image
    restart: unless-stopped
    ports:
      - target: 80
        published: "80"
        protocol: tcp
      - target: 443
        published: "443"
        protocol: tcp
    volumes:
      - type: bind
        source: ./deploy/nginx/yfeistai-classroom.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    secrets:
      - source: gateway_fullchain_pem
        target: gateway_fullchain.pem
      - source: gateway_private_key_pem
        target: gateway_private_key.pem
    networks:
      - platform-internal
      - platform-edge
    depends_on:
      deeptutor:
        condition: service_healthy

  postgres:
    image: *postgres-image
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${YFEISTAI_PLATFORM_DATABASE_NAME:-yfeistai}"
      POSTGRES_USER: yfeistai_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/platform_database_password
    secrets:
      - platform_database_password
    volumes:
      - platform-postgres:/var/lib/postgresql/data
    networks:
      - platform-internal
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U yfeistai_admin -d ${YFEISTAI_PLATFORM_DATABASE_NAME:-yfeistai}"
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: *minio-image
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_bootstrap_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_bootstrap_secret_key
    secrets:
      - minio_bootstrap_access_key
      - minio_bootstrap_secret_key
    volumes:
      - platform-minio:/data
    networks:
      - platform-internal
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 10s
      timeout: 5s
      retries: 12

  minio-bootstrap:
    image: *minio-client-image
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        mc alias set platform http://minio:9000 "$$(cat /run/secrets/minio_bootstrap_access_key)" "$$(cat /run/secrets/minio_bootstrap_secret_key)"
        bucket="platform/${YFEISTAI_OBJECT_STORE_BUCKET:-yfeistai-classrooms}"
        mc mb --ignore-existing "$$bucket"
        mc version enable "$$bucket"
        mc version info "$$bucket" | grep -F "versioning is enabled"
    secrets:
      - minio_bootstrap_access_key
      - minio_bootstrap_secret_key
    networks:
      - platform-internal
    depends_on:
      minio:
        condition: service_healthy

  teaching-migrate:
    image: *deeptutor-image
    restart: "no"
    user: "1000:1000"
    entrypoint:
      - python
    command:
      - scripts/migrate_teaching.py
    healthcheck:
      disable: true
    environment:
      YFEISTAI_PLATFORM_ADMIN_PASSWORD_FILE: /run/secrets/platform_database_password
      YFEISTAI_PLATFORM_APP_PASSWORD_FILE: /run/secrets/platform_database_app_password
      YFEISTAI_PLATFORM_MIGRATION_USER: yfeistai_migrator
      YFEISTAI_PLATFORM_MIGRATION_PASSWORD_FILE: /run/secrets/platform_database_migration_password
    secrets:
      - platform_database_password
      - platform_database_app_password
      - platform_database_migration_password
    volumes:
      - ./data:/app/data
      - type: volume
        source: platform-secret-mask
        target: /app/data/system/secrets
        read_only: true
        volume:
          nocopy: true
    networks:
      - platform-internal
    depends_on:
      postgres:
        condition: service_healthy

  tenant-provisioner:
    <<: *teaching-process
    entrypoint:
      - python
      - -m
      - deeptutor.teaching.processes
    command:
      - tenant-provisioner
    environment:
      YFEISTAI_PLATFORM_MIGRATION_USER: yfeistai_migrator
      YFEISTAI_PLATFORM_MIGRATION_PASSWORD_FILE: /run/secrets/platform_database_migration_password
      MINIO_ROOT_USER_FILE: /run/secrets/minio_bootstrap_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_bootstrap_secret_key
    secrets:
      - platform_database_app_password
      - platform_database_migration_password
      - minio_bootstrap_access_key
      - minio_bootstrap_secret_key
    volumes:
      - ./data:/app/data
      - type: volume
        source: platform-secret-mask
        target: /app/data/system/secrets
        read_only: true
        volume:
          nocopy: true
      - type: bind
        source: ./data/system/secrets/tenants
        target: /run/yfeistai/tenant-secrets
        read_only: false

  openmaic:
    image: *openmaic-image
    restart: unless-stopped
    environment:
      YFEISTAI_OPENMAIC_STATE_ROOT: /tmp/yfeistai-openmaic-state
      YFEISTAI_OPENMAIC_ARTIFACT_ROOT: /tmp/yfeistai-openmaic-artifacts
      YFEISTAI_OPENMAIC_RENDER_ENDPOINT: http://openmaic-render:9000
    secrets:
      - openmaic_service_secret
    volumes:
      - openmaic-shared-data:/tmp
    networks:
      - platform-internal
      - shared-provider-egress
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/yfeistai/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12

  shared-data-plane-bootstrap:
    image: *deeptutor-image
    restart: "no"
    user: "1000:1000"
    entrypoint:
      - python
    command:
      - scripts/bootstrap_shared_data_plane.py
    healthcheck:
      disable: true
    secrets:
      - platform_database_app_password
      - openmaic_service_secret
    volumes:
      - ./data:/app/data
      - type: volume
        source: platform-secret-mask
        target: /app/data/system/secrets
        read_only: true
        volume:
          nocopy: true
    networks:
      - platform-internal
    depends_on:
      teaching-migrate:
        condition: service_completed_successfully
      openmaic:
        condition: service_healthy

  openmaic-render:
    image: *openmaic-render-image
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      - platform-internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12

  teaching-dispatcher:
    <<: *teaching-process
    command:
      - dispatcher
    secrets:
      - platform_database_app_password

  teaching-worker:
    <<: *teaching-process
    command:
      - worker
    secrets:
      - platform_database_app_password
      - openmaic_service_secret

  teaching-export-worker:
    <<: *teaching-process
    command:
      - export-worker
    secrets:
      - platform_database_app_password
      - openmaic_service_secret

  teaching-reaper:
    <<: *teaching-process
    command:
      - reaper
    secrets:
      - platform_database_app_password

  learning-projector:
    <<: *teaching-process
    command:
      - learning-projector
    secrets:
      - platform_database_app_password

networks:
  platform-internal:
    driver: bridge
    internal: true
  platform-edge:
    driver: bridge
  shared-provider-egress:
    driver: bridge
  platform-service-egress:
    driver: bridge

volumes:
  platform-postgres:
  platform-minio:
  openmaic-shared-data:
  platform-secret-mask:

secrets:
  platform_database_password:
    file: ./data/system/secrets/platform_database_password
  platform_database_app_password:
    file: ./data/system/secrets/platform_database_app_password
  platform_database_migration_password:
    file: ./data/system/secrets/platform_database_migration_password
  minio_bootstrap_access_key:
    file: ./data/system/secrets/minio_bootstrap_access_key
  minio_bootstrap_secret_key:
    file: ./data/system/secrets/minio_bootstrap_secret_key
  classroom_ticket_secret:
    file: ./data/system/secrets/classroom_ticket_secret
  openmaic_service_secret:
    file: ./data/system/secrets/openmaic_service_secret
  gateway_fullchain_pem:
    file: ./data/system/secrets/gateway_fullchain.pem
  gateway_private_key_pem:
    file: ./data/system/secrets/gateway_private_key.pem
